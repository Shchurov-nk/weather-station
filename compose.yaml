# The whole station as one stack. Only caddy publishes ports; api and db
# talk over the internal compose network. Each service gets an explicit
# environment: list (least privilege) instead of a shared env_file.

# Docker's json-file driver keeps logs forever by default; on a small disk
# that is a slow-motion outage (full disk stops Postgres). 30 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Let's Encrypt certificates live in caddy_data. Without the volume
      # every container recreation would hit LE again -> rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    # CI builds and pushes this image; the VPS only pulls it (scripts/deploy.sh),
    # so a 1 GB server never builds. Local dev still builds: `up -d --build`.
    # API_TAG pins an older sha-<short> tag to roll back: see docs/vps-runbook.md.
    image: ghcr.io/shchurov-nk/weather-station-api:${API_TAG:-latest}
    build: ./api
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SENSOR_TOKEN: ${SENSOR_TOKEN}
    depends_on:
      db:
        # Orders startup only; if db restarts later, the api reconnects
        # on the next request (fresh connection per request).
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Data outlives the container: `down` keeps it, `down -v` DESTROYS it.
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is empty (first boot).
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # $$ so compose passes a literal $ to the container's shell.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  caddy_data:
  caddy_config:
