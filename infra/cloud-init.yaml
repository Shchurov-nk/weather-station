#cloud-config
# Provisioning for a fresh Ubuntu 24.04 VPS — the automated equivalent of
# docs/vps-runbook.md §1–5 (user, SSH hardening, firewall, unattended
# upgrades, swap, Docker). Paste it into the provider's "user data" field
# when CREATING the machine; it runs once, on first boot, before your first
# SSH login. It does not apply to an already-running server — for that,
# follow the runbook by hand or reach for Ansible.
#
# Before use, replace PASTE_YOUR_PUBLIC_KEY_HERE below with the contents of
# ~/.ssh/id_ed25519.pub (the *public* half — one line, starts "ssh-ed25519").
#
# What is deliberately NOT here: domain registration, secrets, and the app
# itself (runbook §0 and §6). Those need values only you have, and a machine
# image should not carry secrets.

# Only `deploy` — no distro default user. Password login is off everywhere,
# so the account has no password at all: sudo is passwordless instead of
# guarded by a secret you would have to store somewhere.
users:
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - PASTE_YOUR_PUBLIC_KEY_HERE

# Refuse password authentication, and give root a login shell nobody can use.
ssh_pwauth: false
disable_root: true

# cloud-init creates the file, runs mkswap/swapon and adds the fstab entry.
# ~1 GB of RAM means `docker build` next to Postgres can hit OOM without it.
# Size is in bytes because older cloud-init builds reject "2G".
swap:
  filename: /swapfile
  size: 2147483648

write_files:
  # Belt and braces: ssh_pwauth above already disables passwords, but an
  # explicit drop-in survives provider images that ship their own config.
  - path: /etc/ssh/sshd_config.d/90-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin no
      KbdInteractiveAuthentication no

  # Non-interactive equivalent of `dpkg-reconfigure -plow unattended-upgrades`.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

package_update: true
package_upgrade: true

# Docker is absent here on purpose: Ubuntu's own docker.io lags behind and
# splits compose out awkwardly, so it comes from the upstream repo in runcmd,
# which needs a GPG key added after this stage.
packages:
  - ca-certificates
  - curl
  - git
  - ufw
  - unattended-upgrades

runcmd:
  # --- firewall ---
  # 80 stays open for the ACME HTTP-01 challenge and the redirect to 443.
  # `--force` because plain `ufw enable` prompts, and there is no terminal here.
  # Note: Docker publishes ports straight into iptables, bypassing ufw — never
  # rely on these rules to hide a port you published in compose.yaml.
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22,80,443/tcp"]
  - [ufw, --force, enable]

  # --- Docker from the official repository ---
  - [install, -m, "0755", -d, /etc/apt/keyrings]
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - [chmod, "a+r", /etc/apt/keyrings/docker.asc]
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - [apt-get, update]
  - [apt-get, install, -y, docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
  # Membership in `docker` is equivalent to root on this box — which is why
  # hardening above comes first. The group only exists after the install.
  - [usermod, -aG, docker, deploy]

  # --- application directory, left empty for runbook §6 ---
  - [mkdir, -p, /opt/weather-station]
  - [chown, "deploy:deploy", /opt/weather-station]

  - [systemctl, restart, ssh]

# Verify from home once the boot finishes (a minute or two):
#   ssh deploy@<ip> 'docker compose version && swapon --show && sudo ufw status'
final_message: "cloud-init done after $UPTIME s — provisioning complete, ready for runbook §6"
