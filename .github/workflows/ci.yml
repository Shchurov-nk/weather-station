name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      # Full tag: setup-uv stopped publishing moving major tags after v7.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  # The Dockerfile is a deploy artifact; catch uv.lock drift (--frozen) early.
  # PRs only build; pushes to main also publish to GHCR for the VPS to pull.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/shchurov-nk/weather-station-api
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$IMAGE:latest" -t "$IMAGE:sha-${GITHUB_SHA::7}" ./api
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push --all-tags "$IMAGE"

  # Runs scripts/deploy.sh on the VPS over ssh, once the image is in GHCR.
  # Deploys queue up instead of cancelling each other: a half-finished
  # `compose up` is worse than waiting.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: ssh key and pinned host key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # No command here on purpose: authorized_keys pins this key to
      # `git pull --ff-only && ./scripts/deploy.sh` and ignores whatever we
      # send. `true` is a placeholder; -T avoids a pty the key is denied.
      - run: ssh -o BatchMode=yes -T deploy@193.124.115.214 true
