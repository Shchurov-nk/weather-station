[project]
name = "weather-api"
version = "0.1.0"
description = "Receives BME280 readings from the ESP32 and stores them in Postgres"
requires-python = ">=3.13"
dependencies = [
    "flask>=3",
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
# Flat module, not an installable package: uv manages deps only.
package = false

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# Import sorting (isort) is not in ruff's default select.
extend-select = ["I"]
